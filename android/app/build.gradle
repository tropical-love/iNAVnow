// 외부 의존성 없음 — 통신은 HttpURLConnection, JSON은 플랫폼 org.json. server.js의 '의존성 0'과 같은 방침.
plugins { id 'com.android.application' }

// 릴리스 서명 키 — android/keystore.properties(git에 없음)가 있으면 그 키로, 없으면 디버그 키로 서명한다.
// 서명이 바뀌면 기존 설치본 위에 업데이트가 안 되므로 .jks와 비밀번호는 반드시 백업할 것.
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.inavnow'
    compileSdk 34

    defaultConfig {
        applicationId 'com.inavnow'
        minSdk 26          // WebView의 fetch·TextDecoder·Response가 안정적으로 있는 하한(Android 8.0)
        targetSdk 34
        versionCode 4
        versionName '1.1.2'
    }

    signingConfigs {
        if (ksFile.exists()) {
            release {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false   // 에셋 JS는 난독화 대상이 아니고, 자바 코드가 200줄뿐이라 이득이 없다
            // 키가 없으면 디버그 키로 서명한다 — 설치는 되게 하고, 서명 주체만 달라진다
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    // 배포 파일명은 inavnow.apk — 받는 사람 폰에 app-debug.apk로 떨어지면 뭔지 알 수 없다
    applicationVariants.all { variant ->
        if (variant.buildType.name == 'release') variant.outputs.all { outputFileName = 'inavnow.apk' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
