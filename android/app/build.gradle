// 외부 의존성 없음 — 통신은 HttpURLConnection, JSON은 플랫폼 org.json. server.js의 '의존성 0'과 같은 방침.
plugins { id 'com.android.application' }

// 릴리스 서명 키 — android/keystore.properties(git에 없음)가 있어야 release를 만들 수 있다(없으면 빌드 중단).
// 서명이 바뀌면 기존 설치본 위에 업데이트가 안 되므로 .jks와 비밀번호는 반드시 백업할 것.
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.inavnow'
    compileSdk 34

    defaultConfig {
        applicationId 'com.inavnow'
        minSdk 26          // WebView의 fetch·TextDecoder·Response가 안정적으로 있는 하한(Android 8.0)
        targetSdk 34
        versionCode 25
        versionName '1.4'
    }

    signingConfigs {
        if (ksFile.exists()) {
            release {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false   // 에셋 JS는 난독화 대상이 아니고, 자바 코드가 200줄뿐이라 이득이 없다
            // 키가 없으면 서명 설정을 두지 않고, 아래 taskGraph 검사가 release 빌드를 멈춘다.
            // 디버그 키로 대신 서명하면 파일명이 같은 inavnow.apk라 그대로 배포될 수 있고,
            // 받는 사람 폰에서는 서명이 달라 기존 앱 위에 업데이트되지 않는다.
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    // 배포 파일명은 inavnow.apk — 받는 사람 폰에 app-debug.apk로 떨어지면 뭔지 알 수 없다
    applicationVariants.all { variant ->
        if (variant.buildType.name == 'release') variant.outputs.all { outputFileName = 'inavnow.apk' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// release를 실제로 만들려 할 때만 멈춘다 — 키가 없어도 assembleDebug는 그대로 되어야 한다.
gradle.taskGraph.whenReady { graph ->
    if (!ksFile.exists() && graph.allTasks.any { it.name.contains('Release') }) {
        throw new GradleException('android/keystore.properties가 없어 release를 서명할 수 없습니다. ' +
                '배포용 키를 두거나, 시험용이면 assembleDebug를 쓰세요.')
    }
}
